<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dictionnaire d’accords">
<title>Dictionnaire d’accords</title>
<style>
:root{--bg:#090d0f;--surface:#111719;--surface2:#2c2c2e;--line:#30383d;--button-line:#48484a;--text:#d1d1d1;--muted:#919aa1;--blue:#4ba4ff;--aqua:#2bc6aa;--danger:#d06b6b}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -25%,#1b272c 0,var(--bg) 47%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
button,input,select{font:inherit}.app{width:min(520px,100%);margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}.header{display:flex;align-items:center;gap:11px;padding:2px 1px 15px}.logo{display:grid;grid-template-columns:repeat(2,10px);grid-template-rows:repeat(2,10px);place-content:center;gap:3px;width:44px;height:44px;flex:0 0 44px;border:1px solid #3b3b3d;border-radius:14px;background:#151515;box-shadow:inset 0 1px rgba(255,255,255,.025)}.logo i{border-radius:3px;background:#249cff}.logo i:nth-child(2),.logo i:nth-child(3){background:#4ab5ef}.header h1{min-width:0;margin:0;font-size:clamp(18px,5.7vw,27px);font-weight:700;letter-spacing:-.65px;line-height:1}.header h1 strong{color:var(--blue);font-weight:700}.version{align-self:flex-end;margin-bottom:2px;color:var(--muted);font-size:10px}
.panel{margin-bottom:12px;padding:14px;background:linear-gradient(145deg,rgba(23,29,32,.98),rgba(13,18,20,.98));border:1px solid var(--line);border-radius:14px}.label{display:block;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase}.instrument{display:grid;grid-template-columns:1fr 1fr;gap:8px}.button,.chip{min-height:42px;border:1px solid var(--button-line);border-radius:10px;background:var(--surface2);color:var(--text);font-weight:520;box-shadow:inset 0 1px rgba(255,255,255,.04);transition:border-color .14s,transform .14s,background .14s}.button:active,.chip:active{transform:scale(.97)}.button:hover,.chip:hover{border-color:var(--blue)}.button.active,.chip.active{border-color:var(--blue);background:#19334b}.search{width:100%;height:44px;padding:0 13px;border:1px solid var(--button-line);border-radius:10px;outline:none;background:#0b1012;color:var(--text);font-size:16px}.search:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(75,164,255,.13)}.search-hint{display:block;margin-top:7px;color:var(--muted);font-size:11px}.roots,.qualities{display:grid;gap:7px}.roots{grid-template-columns:repeat(4,1fr)}.qualities{grid-template-columns:repeat(2,1fr)}.chip{min-height:37px;padding:5px;font-size:12px}.quality-more{display:none}.show-advanced .quality-more{display:block}.more{width:100%;margin-top:8px;min-height:34px;background:transparent;color:var(--muted);border:0;font-size:12px}
.builder-title{margin:0 0 13px;font-size:18px;font-weight:700}.builder{display:grid;gap:9px}.builder-row{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:9px}.builder-row>label{color:var(--text);font-size:13px}.control{width:100%;height:42px;padding:0 34px 0 11px;border:1px solid var(--button-line);border-radius:10px;outline:none;background-color:var(--surface2);color:var(--text);font-size:14px;font-weight:520}.control:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(75,164,255,.13)}.notation{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid var(--button-line);border-radius:10px}.notation button{height:40px;border:0;background:var(--surface2);color:var(--text);font-size:19px}.notation button+button{border-left:1px solid var(--button-line)}.notation button.active{background:var(--blue);color:#fff}.builder-help{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.4}
.result{display:grid;gap:12px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.chord-name{margin:0;color:var(--blue);font-size:34px;line-height:1}.chord-full{margin:5px 0 0;color:var(--text);font-size:14px}.instrument-name{display:grid;place-items:center;align-self:center;min-height:52px;padding:7px 14px;border:1px solid var(--line);border-radius:10px;background:#0d1214;color:var(--muted);font-size:34px;line-height:1;letter-spacing:0}.diagram-wrap{display:grid;place-items:center;min-height:290px;padding:10px;border:1px solid #d7d7d7;border-radius:10px;background:#fff;overflow:hidden}.diagram{width:min(170px,58%);height:auto;display:block;margin:auto}.diagram text{font-family:Arial,"Helvetica Neue",sans-serif}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{padding:10px;border:1px solid var(--line);border-radius:9px;background:#0d1214}.fact small{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.fact strong{font-size:13px;font-weight:520}.explain{width:100%;border:0;background:transparent;color:var(--muted);font-size:12px}.explain-body{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:#b9c8d3;font-size:12px;line-height:1.5}.explain-body.open{display:block}.primary{width:100%;min-height:45px;border-color:var(--blue);background:#19334b}.primary.added{border-color:#26765f;background:#16483c;color:#d7fff5}
.list-head{display:flex;align-items:center;justify-content:space-between}.list-head h2{margin:0;font-size:18px}.count{color:var(--muted);font-size:12px}.saved-list{display:grid;gap:7px;margin-top:11px}.empty{padding:20px 8px;text-align:center;color:var(--muted);font-size:12px}.saved{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#0d1214}.saved b{color:var(--blue)}.saved span{color:var(--muted);font-size:11px}.remove{width:34px;height:32px;padding:0;border:1px solid var(--button-line);border-radius:8px;background:var(--surface2);color:var(--text)}.print-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 0}
@media(min-width:780px){.app{width:min(980px,100%)}.main-grid{display:grid;grid-template-columns:minmax(310px,.82fr) minmax(390px,1.18fr);gap:12px}.selector-column .panel:last-child{margin-bottom:0}.result-panel{grid-row:span 2}.diagram-wrap{min-height:330px}.diagram{width:190px}.library{grid-column:1/-1}}
@media print{body{background:#fff;color:#111}.app>*:not(.library){display:none}.app{width:100%;padding:0}.library{border:0;background:#fff}.list-head,.print-row,.empty,.footer{display:none!important}.saved-list{grid-template-columns:repeat(3,1fr);gap:14px}.saved{display:block;break-inside:avoid;border:1px solid #777;background:#fff;color:#111;text-align:center}.saved b{display:block;color:#111;font-size:20px}.saved span{color:#333}.remove{display:none}}
</style>
</head>
<body>
<main class="app">
  <header class="header"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>DICTIONNAIRE <strong>D’ACCORDS</strong></h1><small class="version">v1.0</small></header>
  <div class="main-grid">
    <div class="selector-column">
      <section class="panel"><span class="label">Instrument</span><div class="instrument"><button class="button instrument-button active" data-instrument="guitar">Guitare</button><button class="button instrument-button" data-instrument="ukulele">Ukulélé</button></div></section>
      <section class="panel"><label class="label" for="search">Rechercher un accord</label><input id="search" class="search" placeholder="" autocomplete="off"></section>
      <section class="panel" aria-labelledby="builder-title">
        <h2 class="builder-title" id="builder-title">Construire un accord</h2>
        <div class="builder">
          <div class="builder-row"><label for="root-select">Tonalité</label><select class="control" id="root-select"></select></div>
          <div class="builder-row"><label>Notation</label><div class="notation" aria-label="Notation des altérations"><button type="button" id="flat-note">♭</button><button type="button" id="sharp-note" class="active">♯</button></div></div>
          <div class="builder-row"><label for="family-select">Type</label><select class="control" id="family-select"><option value="major">Majeur</option><option value="minor">Mineur</option><option value="sus">Suspendu</option><option value="dim">Diminué</option><option value="aug">Augmenté</option></select></div>
          <div class="builder-row"><label for="extension-select">Extension</label><select class="control" id="extension-select"></select></div>
        </div>
      </section>
    </div>
    <section class="panel result-panel" aria-live="polite">
      <div class="result">
        <div class="result-head"><div><h2 class="chord-name" id="chord-name">C</h2><p class="chord-full" id="chord-full">Do majeur</p></div><span class="instrument-name" id="instrument-name">Guitare</span></div>
        <div class="diagram-wrap" id="diagram-wrap"></div>
        <div class="facts"><div class="fact"><small>Formule</small><strong id="formula">1–3–5</strong></div><div class="fact"><small>Notes</small><strong id="notes">C–E–G</strong></div></div>
        <button class="explain" id="explain">Comprendre cet accord ▾</button><div class="explain-body" id="explain-body"></div>
        <button class="button primary" id="add">Ajouter à ma fiche</button>
      </div>
    </section>
    <section class="panel library">
      <div class="list-head"><h2>Ma fiche d’accords</h2><span class="count" id="count">0 accord</span></div>
      <div class="saved-list" id="saved-list"><div class="empty">Les accords ajoutés apparaîtront ici.</div></div>
      <div class="print-row"><button class="button" id="print">Imprimer / PDF</button><button class="button" id="clear">Vider la fiche</button></div>
    </section>
  </div>
  <footer class="footer">Steeve Langevin (2026) - Folk Guitare &amp; Ukulélé</footer>
</main>
<script src="ukulele-chords.js"></script>
<script>
const ROOTS=[{n:'C',pc:0},{n:'C♯/D♭',pc:1},{n:'D',pc:2},{n:'D♯/E♭',pc:3},{n:'E',pc:4},{n:'F',pc:5},{n:'F♯/G♭',pc:6},{n:'G',pc:7},{n:'G♯/A♭',pc:8},{n:'A',pc:9},{n:'A♯/B♭',pc:10},{n:'B',pc:11}];
const SHARP=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const FRENCH_SHARP=['Do','Do dièse','Ré','Ré dièse','Mi','Fa','Fa dièse','Sol','Sol dièse','La','La dièse','Si'];
const FRENCH_FLAT=['Do','Ré bémol','Ré','Mi bémol','Mi','Fa','Sol bémol','Sol','La bémol','La','Si bémol','Si'];
const TYPES=[
 {id:'',label:'Majeur',name:'Majeur',f:[0,4,7],formula:'1–3–5',aliases:['maj','majeur']},
 {id:'m',label:'Mineur',name:'Mineur',f:[0,3,7],formula:'1–♭3–5',aliases:['min','mineur','-']},
 {id:'7',label:'Septième',name:'Septième',f:[0,4,7,10],formula:'1–3–5–♭7',aliases:['dom7']},
 {id:'maj7',label:'Majeur 7',name:'Majeur sept',f:[0,4,7,11],formula:'1–3–5–7',aliases:['ma7','maj 7','major7']},
 {id:'m7',label:'Mineur 7',name:'Mineur sept',f:[0,3,7,10],formula:'1–♭3–5–♭7',aliases:['min7','-7']},
 {id:'sus2',label:'Sus2',name:'Suspendu deux',f:[0,2,7],formula:'1–2–5',aliases:['sus 2']},
 {id:'sus4',label:'Sus4',name:'Suspendu quatre',f:[0,5,7],formula:'1–4–5',aliases:['sus','sus 4']},
 {id:'add9',label:'Add9',name:'Additionné neuf',f:[0,4,7,2],formula:'1–3–5–9',aliases:['add 9']},
 {id:'dim',label:'Diminué',name:'Diminué',f:[0,3,6],formula:'1–♭3–♭5',aliases:['°','o','diminished'],more:true},
 {id:'m7♭5',label:'Mineur 7♭5',name:'Mineur sept, bémol cinq',f:[0,3,6,10],formula:'1–♭3–♭5–♭7',aliases:['m7b5','ø','ø7','half diminished'],more:true},
 {id:'6',label:'Sixième',name:'Sixième',f:[0,4,7,9],formula:'1–3–5–6',aliases:['6'],more:true},
 {id:'m6',label:'Mineur 6',name:'Mineur six',f:[0,3,7,9],formula:'1–♭3–5–6',aliases:['min6'],more:true},
 {id:'9',label:'Neuvième',name:'Neuvième',f:[0,4,7,10,2],formula:'1–3–5–♭7–9',aliases:['9'],more:true},
 {id:'dim7',label:'Diminué 7',name:'Diminué sept',f:[0,3,6,9],formula:'1–♭3–♭5–𝄫7',aliases:['°7','o7'],more:true},
 {id:'aug',label:'Augmenté',name:'Augmenté',f:[0,4,8],formula:'1–3–♯5',aliases:['+'],more:true}
];
const FAMILIES={major:['','6','7','maj7','add9','9'],minor:['m','m6','m7','m7♭5'],sus:['sus2','sus4'],dim:['dim','dim7'],aug:['aug']};
const TUNINGS={guitar:{name:'Guitare',notes:[40,45,50,55,59,64],labels:['E','A','D','G','B','E']},ukulele:{name:'Ukulélé',notes:[67,60,64,69],labels:['G','C','E','A']}};
const REFERENCE_VOICINGS={'ukulele|2|m':[2,2,1,0]};
let instrument='guitar',root=0,type=TYPES[0],notation='sharp',saved=JSON.parse(localStorage.getItem('accords-fiche-v1')||'[]');
function noteNames(){return notation==='flat'?FLAT:SHARP}
function chordLabel(){const r=noteNames()[root];return r+type.id}
function frenchChordName(){const names=notation==='flat'?FRENCH_FLAT:FRENCH_SHARP;return `${names[root]} ${type.name.toLowerCase()}`}
function notesText(){const names=noteNames();return type.f.map(i=>names[(root+i)%12]).join('–')}
function familyFor(id){return Object.keys(FAMILIES).find(f=>FAMILIES[f].includes(id))||'major'}
function populateRoots(){const select=document.getElementById('root-select');select.innerHTML=noteNames().map((n,pc)=>`<option value="${pc}">${n}</option>`).join('');select.value=String(root)}
function populateExtensions(family=familyFor(type.id)){const ids=FAMILIES[family],select=document.getElementById('extension-select');select.innerHTML=ids.map(id=>{const t=TYPES.find(x=>x.id===id);const label=id===''||id==='m'||id==='dim'||id==='aug'?'Sans extension':t.label;return `<option value="${id}">${label}</option>`}).join('');if(ids.includes(type.id))select.value=type.id;else{type=TYPES.find(t=>t.id===ids[0]);select.value=type.id}}
function parseChord(value){let s=value.trim().replaceAll('♯','#').replaceAll('♭','b').replace(/\s+/g,'').toLowerCase();if(!s)return null;const m=s.match(/^([a-g])([#b]?)(.*)$/);if(!m)return null;const base={c:0,d:2,e:4,f:5,g:7,a:9,b:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);const rest=m[3].replace(/[()]/g,'');const found=TYPES.find(t=>[t.id,...t.aliases].map(x=>x.toLowerCase().replaceAll('♭','b').replaceAll('♯','#').replace(/\s+/g,'')).includes(rest));return found?{root:(base+12)%12,type:found}:null}
function candidateVoicing(){if(instrument==='ukulele'){const verified=window.UKULELE_CHORDS?.[`${root}|${type.id}`];if(verified)return verified}const reference=REFERENCE_VOICINGS[`${instrument}|${root}|${type.id}`];if(reference)return {frets:[...reference],fingers:null,baseFret:1,barres:[]};const tuning=TUNINGS[instrument].notes,target=new Set(type.f.map(i=>(root+i)%12)),maxFret=instrument==='guitar'?8:10,choices=tuning.map(n=>[-1,...Array.from({length:maxFret+1},(_,f)=>f)].filter(f=>f<0||target.has((n+f)%12)));let best=null,bestScore=1e9;
 function walk(i,arr){if(i===choices.length){const sounding=arr.filter(f=>f>=0);if(sounding.length<(instrument==='guitar'?4:3))return;const pcs=new Set(arr.map((f,j)=>f<0?null:(tuning[j]+f)%12).filter(x=>x!==null));if([...target].some(p=>!pcs.has(p))||!pcs.has(root))return;const fretted=sounding.filter(f=>f>0),min=fretted.length?Math.min(...fretted):0,max=fretted.length?Math.max(...fretted):0;if(max-min>4)return;const fingers=new Set(fretted).size;if(fingers>4)return;const bassIndex=arr.findIndex(f=>f>=0),bass=bassIndex<0?-1:(tuning[bassIndex]+arr[bassIndex])%12;let score=max*3+(max-min)*5+arr.filter(f=>f<0).length*5+fingers*2+(bass===root?0:8)-arr.filter(f=>f===0).length*2;if(type.f.length>=4&&pcs.size<4)score+=20;if(score<bestScore){bestScore=score;best=[...arr]}}else for(const f of choices[i]){arr.push(f);walk(i+1,arr);arr.pop()}}
 walk(0,[]);return {frets:best||tuning.map(()=>-1),fingers:null,baseFret:1,barres:[]}}
function diagramSVG(position){
 const voicing=position.frets,strings=voicing.length,w=260,h=350,left=55,right=235,top=103,bottom=292,spacing=(right-left)/(strings-1),fretted=voicing.filter(f=>f>0),start=position.baseFret||1,frets=Math.max(3,Math.min(4,fretted.length?Math.max(...fretted):3)),row=(bottom-top)/frets;
 const fingerMap=new Map();if(position.fingers)position.fingers.forEach((finger,i)=>{if(finger>0)fingerMap.set(i,finger)});else{const ordered=voicing.map((f,i)=>({f,i})).filter(x=>x.f>0).sort((a,b)=>a.f-b.f||a.i-b.i);let nextFinger=1;ordered.forEach(x=>fingerMap.set(x.i,Math.min(4,nextFinger++)))}
 let s=`<svg class="diagram" viewBox="0 0 ${w} ${h}" role="img" aria-label="Diagramme de ${chordLabel()}">`;
 s+=`<rect width="${w}" height="${h}" fill="#fff"/>`;
 s+=`<text x="130" y="49" text-anchor="middle" fill="#292929" font-size="58" font-weight="700" letter-spacing="-2">${chordLabel()}</text>`;
 for(let i=0;i<strings;i++){const x=left+i*spacing;s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="#292929" stroke-width="0.65"/>`}
 for(let f=0;f<=frets;f++){const y=top+f*row;s+=`<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#292929" stroke-width="0.65"/>`}
 s+=`<rect x="${left-4}" y="83" width="${right-left+8}" height="20" rx="5" fill="#292929"/>`;
 if(start>1)s+=`<text x="18" y="${top+row/2+10}" text-anchor="middle" fill="#292929" font-size="30" font-weight="700">${start}</text>`;
 const barredStrings=new Set();(position.barres||[]).forEach(f=>{const indexes=voicing.map((v,i)=>v===f?i:-1).filter(i=>i>=0);if(indexes.length>1){indexes.forEach(i=>barredStrings.add(i));const x1=left+Math.min(...indexes)*spacing,x2=left+Math.max(...indexes)*spacing,y=top+(f-.5)*row,finger=fingerMap.get(indexes[0])||1;s+=`<rect x="${x1-24.4}" y="${y-24.4}" width="${x2-x1+48.8}" height="48.8" rx="24.4" fill="#292929"/><text x="${(x1+x2)/2}" y="${y+10}" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">${finger}</text>`}});
 voicing.forEach((f,i)=>{const x=left+i*spacing;if(f<0)s+=`<circle cx="${x}" cy="66" r="12.5" fill="none" stroke="#292929" stroke-width="2.8"/><text x="${x}" y="72" text-anchor="middle" fill="#292929" font-size="18" font-weight="800">X</text>`;else if(f>0&&!barredStrings.has(i)){const y=top+(f-.5)*row;if(f<=frets){const finger=fingerMap.get(i)||1;s+=`<circle cx="${x}" cy="${y}" r="24.4" fill="#292929"/><text x="${x}" y="${y+10}" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">${finger}</text>`}}});
 const tuning=TUNINGS[instrument].notes,names=noteNames();voicing.forEach((f,i)=>{const x=left+i*spacing,label=f<0?'X':names[(tuning[i]+(f===0?0:start>1?start+f-1:f))%12];s+=`<text x="${x}" y="329" text-anchor="middle" fill="#292929" font-size="22" font-weight="700">${label}</text>`});
 return s+'</svg>'}
function render(){document.querySelectorAll('.instrument-button').forEach(b=>b.classList.toggle('active',b.dataset.instrument===instrument));populateRoots();const family=familyFor(type.id);document.getElementById('family-select').value=family;populateExtensions(family);document.getElementById('flat-note').classList.toggle('active',notation==='flat');document.getElementById('sharp-note').classList.toggle('active',notation==='sharp');document.getElementById('chord-name').textContent=chordLabel();document.getElementById('chord-full').textContent=frenchChordName();document.getElementById('instrument-name').textContent=TUNINGS[instrument].name;document.getElementById('formula').textContent=type.formula;document.getElementById('notes').textContent=notesText();document.getElementById('diagram-wrap').innerHTML=diagramSVG(candidateVoicing());const ukeNine=instrument==='ukulele'&&type.id==='9'?' Comme un accord de neuvième contient cinq notes pour quatre cordes, cette position usuelle omet la fondamentale.':'';document.getElementById('explain-body').textContent=`L’accord ${chordLabel()} contient les degrés ${type.formula}. Ses notes théoriques sont ${notesText()}. Le diagramme privilégie une position compacte et jouable.${ukeNine}`;const key=`${instrument}|${root}|${type.id}`;const exists=saved.some(x=>x.key===key);const add=document.getElementById('add');add.textContent=exists?'Ajouté à ma fiche':'Ajouter à ma fiche';add.classList.toggle('added',exists);renderSaved()}
function renderSaved(){const list=document.getElementById('saved-list');document.getElementById('count').textContent=`${saved.length} accord${saved.length===1?'':'s'}`;if(!saved.length){list.innerHTML='<div class="empty">Les accords ajoutés apparaîtront ici.</div>';return}list.innerHTML=saved.map((x,i)=>`<div class="saved"><b>${x.label}</b><div><span>${x.instrument}</span><br><span>${x.notes}</span></div><button class="remove" data-remove="${i}" aria-label="Retirer ${x.label}">×</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saved.splice(+b.dataset.remove,1);store();render()})}
function store(){localStorage.setItem('accords-fiche-v1',JSON.stringify(saved))}
populateRoots();populateExtensions();
document.querySelectorAll('.instrument-button').forEach(b=>b.onclick=()=>{instrument=b.dataset.instrument;render()});document.getElementById('root-select').onchange=e=>{root=+e.target.value;render()};document.getElementById('family-select').onchange=e=>{const id=FAMILIES[e.target.value][0];type=TYPES.find(t=>t.id===id);render()};document.getElementById('extension-select').onchange=e=>{type=TYPES.find(t=>t.id===e.target.value);render()};document.getElementById('flat-note').onclick=()=>{notation='flat';render()};document.getElementById('sharp-note').onclick=()=>{notation='sharp';render()};
document.getElementById('search').addEventListener('input',e=>{const p=parseChord(e.target.value);if(p){root=p.root;type=p.type;notation=e.target.value.includes('b')||e.target.value.includes('♭')?'flat':'sharp';render()}});
document.getElementById('explain').onclick=()=>{const b=document.getElementById('explain-body');b.classList.toggle('open');document.getElementById('explain').textContent=b.classList.contains('open')?'Masquer l’explication ▴':'Comprendre cet accord ▾'};
document.getElementById('add').onclick=()=>{const key=`${instrument}|${root}|${type.id}`;if(!saved.some(x=>x.key===key)){saved.push({key,label:chordLabel(),instrument:TUNINGS[instrument].name,notes:notesText()});store()}render()};document.getElementById('clear').onclick=()=>{saved=[];store();render()};document.getElementById('print').onclick=()=>window.print();render();
</script>
</body>
</html>
